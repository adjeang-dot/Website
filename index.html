<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar - GnB</title>
    <!-- Penghubung Style yang sudah ada -->
    <link rel="stylesheet" href="style.css">
    <!-- CDN Supabase JavaScript SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <!-- Header / Judul Brand -->
        <div class="brand-header">
            <h1>GnB</h1>
            <p>Selamat datang, silakan masuk atau daftar akun Anda.</p>
        </div>

        <!-- Bagian Form Login -->
        <div id="login-section" class="form-section">
            <h2>Masuk</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="nama@email.com">
                </div>
                <div class="input-group">
                    <label for="login-password">Kata Sandi</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" required placeholder="••••••••">
                        <button type="button" class="toggle-password" data-target="login-password">👁</button>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Masuk</button>
            </form>
            <p class="switch-text">Belum punya akun GnB? <a href="#" id="show-register">Daftar sekarang</a></p>
        </div>

        <!-- Bagian Form Register (Tersembunyi secara default, bisa diatur lewat CSS/JS toggle) -->
        <div id="register-section" class="form-section" style="display: none;">
            <h2>Daftar Akun Baru</h2>
            <form id="register-form">
                <div class="input-group">
                    <label for="reg-name">Nama Lengkap</label>
                    <input type="text" id="reg-name" required placeholder="Nama Anda">
                </div>
                <div class="input-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required placeholder="nama@email.com">
                </div>
                <div class="input-group">
                    <label for="reg-password">Kata Sandi</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" required placeholder="••••••••">
                        <button type="button" class="toggle-password" data-target="reg-password">👁</button>
                    </div>
                    <!-- Indikator Kekuatan Password -->
                    <div class="strength-meter-container">
                        <div id="strength-bar" class="strength-bar"></div>
                    </div>
                    <small id="strength-text">Masukkan kata sandi</small>
                </div>
                <button type="submit" class="btn-submit">Daftar</button>
            </form>
            <p class="switch-text">Sudah punya akun GnB? <a href="#" id="show-login">Masuk di sini</a></p>
        </div>
    </div>

    <!-- Skrip Utama -->
    <script src="script.js"></script>
    <script>
        // Logika Sederhana untuk beralih tampilan Form Login & Register di index.html
        const loginSection = document.getElementById('login-section');
        const registerSection = document.getElementById('register-section');
        document.getElementById('show-register').addEventListener('click', (e) => {
            e.preventDefault();
            loginSection.style.display = 'none';
            registerSection.style.display = 'block';
        });
        document.getElementById('show-login').addEventListener('click', (e) => {
            e.preventDefault();
            registerSection.style.display = 'none';
            loginSection.style.display = 'block';
        });
    </script>
</body>
</html>
